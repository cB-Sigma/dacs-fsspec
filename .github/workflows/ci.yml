name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,adlfs]"
      # The real client enables tests/test_real_client.py (signature and
      # behaviour drift checks; no cluster needed). It is pre-release and
      # Linux-only, so a missing wheel for a given Python must not fail CI:
      # those tests skip themselves when the client does not import.
      - name: Install the DACS client (best effort)
        continue-on-error: true
        run: python -m pip install dacs-client
      - name: Show which optional pieces are present
        run: python -m dacs_fsspec doctor || true
      - run: coverage run -m pytest
      - run: coverage report --fail-under=90

  minimum-dependencies:
    name: Tests (oldest supported fsspec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "fsspec==2024.12.0" pytest
      - run: pytest

  macos:
    name: Tests (macOS, fake client only)
    runs-on: macos-latest
    # The DACS client has no macOS wheels; this only checks that the package
    # and its fake-backed tests work for local development on a Mac.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and check the entry point
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import fsspec, dacs_fsspec; assert fsspec.get_filesystem_class('dacs') is dacs_fsspec.DacsFileSystem; print(dacs_fsspec.__version__)"
          /tmp/clean/bin/dacs-fsspec --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
