name: Release

# Publishes to PyPI when a version tag (vX.Y.Z) is pushed.
#
# One-time setup: create a "pypi" environment in this repository's settings
# and add this workflow as a trusted publisher for the dacs-fsspec project on
# PyPI (https://docs.pypi.org/trusted-publishers/). No API token is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Check that the tag matches the package version
        run: |
          version="$(python -c "exec(open('src/dacs_fsspec/_version.py').read()); print(__version__)")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import fsspec, dacs_fsspec; assert fsspec.get_filesystem_class('dacs') is dacs_fsspec.DacsFileSystem"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dacs-fsspec/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
